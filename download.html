<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingBell - Download</title>
  <meta property="og:title" content="TradingBell" />
  <meta property="og:description" content="Wake-up alarm for stock & crypto investors" />
  <meta property="og:image" content="https://coinbell.uk/og-image.png" />
  <meta property="og:url" content="https://coinbell.uk/download" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://coinbell.uk/og-image.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0e0e0e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .icon {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      margin-bottom: 16px;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.07);
    }
    h1 {
      font-size: 28px;
      color: #fff;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 40px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-ios {
      background: #fff;
      color: #0e0e0e;
    }
    .btn-android {
      background: #01875f;
      color: #fff;
    }
    .btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="icon" src="icon.png" alt="TradingBell" />
    <h1>TradingBell</h1>
    <p class="subtitle" id="subtitle"></p>

    <a href="https://apps.apple.com/app/id6759854090" class="btn btn-ios" id="ios-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      <span id="ios-label"></span>
    </a>

    <a href="https://play.google.com/store/apps/details?id=com.StockAlarm.app" class="btn btn-android" id="android-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.18 23.76c.3.17.64.17.96 0l11.34-6.55-2.43-2.44-9.87 8.99zM.29 1.57C.11 1.85 0 2.19 0 2.59v18.82c0 .4.11.74.29 1.02l.07.07 10.54-10.54v-.25L.36 1.5l-.07.07zM20.93 10.34l-2.98-1.72-2.7 2.71 2.7 2.7 3-1.73c.86-.5.86-1.3-.02-1.96zM3.18.24L14.52 6.8l-2.43 2.44L2.22.26c.3-.18.66-.18.96-.02z"/></svg>
      <span id="android-label"></span>
    </a>
  </div>

  <script>
    const IOS_URL = 'https://apps.apple.com/app/id6759854090';
    const ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.StockAlarm.app';

    const isKo = navigator.language.startsWith('ko');

    const text = {
      subtitle: isKo ? '주식·코인 투자자를 위한 기상 알람' : 'Wake-up alarm for stock & crypto investors',
      ios: isKo ? 'App Store에서 받기' : 'Download on the App Store',
      android: isKo ? 'Google Play에서 받기' : 'Get it on Google Play',
    };

    document.getElementById('subtitle').textContent = text.subtitle;
    document.getElementById('ios-label').textContent = text.ios;
    document.getElementById('android-label').textContent = text.android;

    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    if (isIOS) {
      window.location.href = IOS_URL;
    } else if (isAndroid) {
      window.location.href = ANDROID_URL;
    }
  </script>
</body>
</html>
